---
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.30.0
directories:
  - path: .source/ingress/nginx/vendor
    contents:
      - path: ./
        git:
          url: https://github.com/nginx/kubernetes-ingress.git
          ref: v5.5.4
        includePaths:
          - deployments/**/*
          - config/crd/bases/**/*
        excludePaths:
          - deployments/common/plus-mgmt-configmap.yaml
          - deployments/daemon-set/nginx-plus-ingress.yaml
          - deployments/deployment/appprotect-dos-arb.yaml
          - deployments/deployment/nginx-plus-ingress.yaml
          - deployments/service/appprotect-dos-arb-svc.yaml
          - deployments/rbac/ap*
          - deployments/stateful-set/**/*
          - deployments/README.md
