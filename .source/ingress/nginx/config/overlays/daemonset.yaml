---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "nginx daemonset"
    path: "../../vendor/deployments/daemon-set/nginx-ingress.yaml"
    outputPath: "ingress/nginx/daemonset.yaml"
    overlays:
      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      - name: "ensure resource limits are added"
        query: spec.template.spec.containers[*]
        value:
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"

      - name: "add daemonset labels"
        query: $
        value:
          metadata:
            labels:
              app.kubernetes.io/name: nginx-ingress

      - name: "update pod metadata"
        query: spec.template.metadata
        action: merge
        value:
          labels:
            app.kubernetes.io/name: nginx-ingress

      - name: "restrict scheduling to linux nodes"
        query: spec.template.spec
        action: merge
        value:
          nodeSelector:
            kubernetes.io/os: linux

      - name: "expose prometheus metrics"
        query: spec.template.metadata
        action: merge
        value:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9113"
            prometheus.io/scheme: http

      - name: "set command arguments in container"
        query: spec.template.spec.containers[*]
        value:
          args:
            - -enable-cert-manager
            - -enable-external-dns
            - -report-ingress-status
            - -external-service=nginx-ingress
            - -enable-prometheus-metrics
