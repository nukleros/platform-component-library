---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "ensure namespace is updated"
    query: metadata.namespace
    value: "{{ .namespace }}"

yamlFiles:
  - name: "nginx service account"
    path: "../../vendor/deployments/common/ns-and-sa.yaml"
    outputPath: "ingress/nginx/rbac.yaml"
    overlays:
      - name: "ensure we are only acting upon service account resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ServiceAccount")]

  - name: "nginx cluster role"
    path: "../../vendor/deployments/rbac/rbac.yaml"
    outputPath: "ingress/nginx/rbac.yaml"
    overlays:
      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"

      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"
