---
# NOTE: a deployment which keda scales from zero using the cron scaler, which has no external
#       dependencies.  the schedule is active for all but the last minute of each day, so the
#       deployment should be scaled to 2 replicas shortly after applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: keda-test
  template:
    metadata:
      labels:
        app: keda-test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-test
spec:
  scaleTargetRef:
    name: keda-test
  pollingInterval: 15
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
    - type: cron
      metadata:
        timezone: "Etc/UTC"
        start: "0 0 * * *"
        end: "59 23 * * *"
        desiredReplicas: "2"
