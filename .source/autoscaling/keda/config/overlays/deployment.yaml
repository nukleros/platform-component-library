---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
      - spec.template.metadata.labels["helm.sh/chart"]
      - spec.template.metadata.labels["app.kubernetes.io/managed-by"]
    action: delete

# NOTE: replicas, resources, affinity, topology spread constraints and security contexts are
#       deliberately not set here, as they are set via values-helm.yaml.
yamlFiles:
  - name: "keda deployments"
    path: "../../vendor/keda.yaml"
    outputPath: "autoscaling/keda/deployment.yaml"
    overlays:
      - name: "ensure we are only acting upon deployment resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "Deployment")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      # NOTE: upstream renders the operator grpc address from the release namespace, which is
      #       'default' because the download script does not pass --namespace.
      - name: "ensure metrics server operator address is updated to match the namespace"
        query: spec.template.spec.containers[?(@.name == "keda-operator-metrics-apiserver")].args[?(@ =~ /^--metrics-service-address=/)]
        value: "--metrics-service-address=keda-operator.{{ .namespace }}.svc.cluster.local:9666"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "keda-operator-metrics-apiserver")]
