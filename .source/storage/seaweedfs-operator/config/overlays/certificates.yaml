---
commonOverlays:
  - name: "apply common and nukleros labels"
    query: "metadata.labels"
    value:
      app: "{{ .project }}"
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
      app.kubernetes.io/name: "{{ .project }}"
      app.kubernetes.io/instance: "{{ .project }}"
      app.kubernetes.io/component: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query: 
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["app.kubernetes.io/version"]
      - spec.template.metadata.labels["helm.sh/chart"]
      - spec.template.metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.annotations["helm.sh/resource-policy"]
    action: delete

  - name: "remove the creation timestamp"
    query: metadata.creationTimestamp
    action: delete

yamlFiles:
  - name: "seaweedfs-operator certificates"
    path: "../../vendor/seaweedfs-operator.yaml"
    outputPath: "storage/seaweedfs-operator/certificates.yaml"
    overlays:
      - name: "ensure we are only acting upon certificate resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "Issuer")]
              - query: $[?($.kind != "ClusterIssuer")]
              - query: $[?($.kind != "Certificate")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      - name: "ensure certificate common name generated correctly"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "Certificate")]
        query: spec.commonName
        action: replace
        onMissing:
          action: inject
        value: "{{ .project }}-webhook.{{ .namespace }}.svc"

      - name: "ensure certificate dns name generated correctly"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "Certificate")]
        query: spec.dnsNames
        action: replace
        value:
          - "{{ .project }}-webhook"
          - "{{ .project }}-webhook.{{ .namespace }}"
          - "{{ .project }}-webhook.{{ .namespace }}.svc"
          - "{{ .project }}-webhook.{{ .namespace }}.svc.cluster.local"
