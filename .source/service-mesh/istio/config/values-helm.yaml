#
# NOTE: this is the helm values file for the Istio 'ambient' umbrella helm chart, which is
# vendored in via the vendor.yaml file.  values for each subchart are nested under the
# subchart name (base, istiod, cni, ztunnel) and values under 'global' apply to all of them.
#
# NOTE: the download script does not pass --namespace to 'helm template', so anything the
# charts derive from .Release.Namespace renders as 'default'.  values which allow the
# namespace to be overridden are set explicitly here; the rest (metadata.namespace, etc.)
# must be handled by the overlays.
#
global:
  # distroless images carry no shell or package manager
  variant: "distroless"
  istioNamespace: "nukleros-service-mesh-system"

  # NOTE: 'gke' is required on GKE.  it leaves cniBinDir empty so the chart autodetects
  #       GKE's nonstandard CNI binary path, and it creates the ResourceQuota that GKE
  #       requires before a pod may use the system-node-critical priority class (which
  #       ztunnel and the CNI agent both use).  it is left unset here so the manifests
  #       work on generic clusters.
  # platform: "gke"

# control plane.  issues the SPIFFE workload certificates that ztunnel presents, each bound
# to the pod's Kubernetes ServiceAccount.
#
# NOTE: profile=ambient is what selects the sidecarless data plane; without it this installs
#       the sidecar-injection control plane instead.
istiod:
  enabled: true
  profile: "ambient"
  trustedZtunnelNamespace: "nukleros-service-mesh-system"
  pilot:
    seccompProfile:
      type: "RuntimeDefault"
  meshConfig:
    defaultConfig:
      discoveryAddress: "istiod.nukleros-service-mesh-system.svc:15012"

# node agent that configures ambient redirection.  this is what lets workload pods run
# without NET_ADMIN, as the CNI plugin replaces the privileged istio-init container pattern.
cni:
  profile: "ambient"
  seccompProfile:
    type: "RuntimeDefault"

# per-node L4 proxy that performs the mTLS.  one pod per node, not one per workload.
#
# NOTE: no seccompProfile override here, deliberately.  the ztunnel chart exposes no such
#       key and an unrecognized key is silently ignored by helm.  ztunnel's securityContext
#       is fixed by the chart and is privileged by necessity (NET_ADMIN and NET_RAW for
#       TPROXY, SYS_ADMIN for setns into other pods' network namespaces).
ztunnel:
  profile: "ambient"
  resourceName: "ztunnel"
  istioNamespace: "nukleros-service-mesh-system"
