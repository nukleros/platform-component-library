---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
      - spec.template.metadata.labels["helm.sh/chart"]
      - spec.template.metadata.labels["app.kubernetes.io/managed-by"]
    action: delete

# NOTE: the container security contexts are deliberately left as upstream sets them.  both the
#       cni agent and ztunnel need elevated node privileges (NET_ADMIN, NET_RAW, SYS_ADMIN) to
#       redirect and encrypt traffic for other pods on the node, which is what allows the
#       meshed workloads themselves to run without them.
yamlFiles:
  - name: "istio daemonsets (gke)"
    path: "../../vendor/istio-gke.yaml"
    outputPath: "service-mesh/istio/daemonset-gke.yaml"
    overlays:
      - name: "ensure we are only acting upon daemonset resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "DaemonSet")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      - name: "ensure cni resources are updated"
        query: spec.template.spec.containers[*]
        value:
          resources:
            requests:
              cpu: "{{ .cni.resources.requests.cpu }}"
              memory: "{{ .cni.resources.requests.memory }}"
            limits:
              cpu: "{{ .cni.resources.limits.cpu }}"
              memory: "{{ .cni.resources.limits.memory }}"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "istio-cni-node")]

      - name: "ensure other cni changes are made"
        query: spec
        action: merge
        value:
          template:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "istio-cni-node")]

      - name: "ensure ztunnel resources are updated"
        query: spec.template.spec.containers[*]
        value:
          resources:
            requests:
              cpu: "{{ .ztunnel.resources.requests.cpu }}"
              memory: "{{ .ztunnel.resources.requests.memory }}"
            limits:
              memory: "{{ .ztunnel.resources.limits.memory }}"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "ztunnel")]

      - name: "ensure other ztunnel changes are made"
        query: spec
        action: merge
        value:
          template:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "ztunnel")]
