---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
    action: delete

yamlFiles:
  - name: "infisical deployments"
    path: "../../vendor/infisical.yaml"
    outputPath: "secrets/infisical/deployment.yaml"
    overlays:
      - name: "ensure we are only acting upon deployment resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "Deployment")]

      - name: "ensure namespace is updated"
        query: metadata
        action: merge
        value:
          namespace: "{{ .namespace }}"

      - name: "remove the updatedAt annotation leaked from the helm render"
        query:
          - metadata.annotations
          - spec.template.metadata.annotations
        action: delete

      - name: "prefix the deployment's component/app labels with app.kubernetes.io"
        query: metadata.labels
        action: merge
        value:
          app.kubernetes.io/component: infisical
          app.kubernetes.io/app: infisical-standalone

      - name: "remove the deployment's unprefixed component/app labels"
        query:
          - metadata.labels.component
          - metadata.labels.app
        action: delete

      - name: "prefix the deployment selector's component/app/release labels with app.kubernetes.io"
        query: spec.selector.matchLabels
        action: merge
        value:
          app.kubernetes.io/component: infisical
          app.kubernetes.io/app: infisical-standalone
          app.kubernetes.io/release: infisical

      - name: "remove the deployment selector's unprefixed component/app/release labels"
        query:
          - spec.selector.matchLabels.component
          - spec.selector.matchLabels.app
          - spec.selector.matchLabels.release
        action: delete

      - name: "prefix the pod template's component/app/release labels with app.kubernetes.io"
        query: spec.template.metadata.labels
        action: merge
        value:
          app.kubernetes.io/component: infisical
          app.kubernetes.io/app: infisical-standalone
          app.kubernetes.io/release: infisical

      - name: "remove the pod template's unprefixed component/app/release labels"
        query:
          - spec.template.metadata.labels.component
          - spec.template.metadata.labels.app
          - spec.template.metadata.labels.release
        action: delete

      - name: "ensure the deployment uses the renamed service account"
        query: spec.template.spec.serviceAccountName
        action: replace
        value: "infisical"

      - name: "ensure server resources are updated"
        query: spec.template.spec.containers[*]
        value:
          resources:
            requests:
              cpu: "{{ .server.resources.requests.cpu }}"
              memory: "{{ .server.resources.requests.memory }}"
            limits:
              cpu: "{{ .server.resources.limits.cpu }}"
              memory: "{{ .server.resources.limits.memory }}"

      - name: "ensure the db connection uri matches the postgresql secret's fake password"
        query: spec.template.spec.containers[*].env[?(@.name == "DB_CONNECTION_URI")].value
        action: replace
        value: "postgresql://infisical:thisisinsecure@postgresql:5432/infisicalDB"

      - name: "ensure the redis url matches the redis secret's fake password"
        query: spec.template.spec.containers[*].env[?(@.name == "REDIS_URL")].value
        action: replace
        value: "redis://default:thisisinsecure@redis-master:6379"

      - name: "ensure other server changes are made"
        query: spec
        action: merge
        value:
          replicas: !!int {{ .server.replicas }}
          template:
            spec:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/component: infisical
                            app.kubernetes.io/app: infisical-standalone
                            app.kubernetes.io/release: infisical
              nodeSelector:
                kubernetes.io/os: linux
