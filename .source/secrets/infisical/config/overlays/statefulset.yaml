---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
    action: delete

yamlFiles:
  - name: "infisical statefulsets"
    path: "../../vendor/infisical.yaml"
    outputPath: "secrets/infisical/statefulset.yaml"
    overlays:
      - name: "ensure we are only acting upon statefulset resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "StatefulSet")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      - name: "ensure postgres resources are updated"
        query: spec.template.spec.containers[*]
        value:
          resources:
            requests:
              cpu: "{{ .postgres.resources.requests.cpu }}"
              memory: "{{ .postgres.resources.requests.memory }}"
            limits:
              cpu: "{{ .postgres.resources.limits.cpu }}"
              memory: "{{ .postgres.resources.limits.memory }}"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "postgresql")]

      - name: "ensure other postgres changes are made"
        query: spec
        action: merge
        value:
          replicas: !!int {{ .postgres.replicas }}
          template:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "postgresql")]

      - name: "remove the postgres ldap flag (yes/no only, no boolean synonyms accepted; defaults to no when unset)"
        query: spec.template.spec.containers[*].env[?(@.name == "POSTGRESQL_ENABLE_LDAP")]
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "postgresql")]

      - name: "remove the postgres tls flag (yes/no only, no boolean synonyms accepted; defaults to no when unset)"
        query: spec.template.spec.containers[*].env[?(@.name == "POSTGRESQL_ENABLE_TLS")]
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "postgresql")]

      - name: "ensure the postgres pgaudit log catalog flag stays a string"
        query: spec.template.spec.containers[*].env[?(@.name == "POSTGRESQL_PGAUDIT_LOG_CATALOG")].value
        action: replace
        value: !!str "false"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "postgresql")]

      - name: "ensure redis resources are updated"
        query: spec.template.spec.containers[*]
        value:
          resources:
            requests:
              cpu: "{{ .redis.resources.requests.cpu }}"
              memory: "{{ .redis.resources.requests.memory }}"
            limits:
              cpu: "{{ .redis.resources.limits.cpu }}"
              memory: "{{ .redis.resources.limits.memory }}"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "redis-master")]

      - name: "ensure the redis empty password flag stays a string"
        query: spec.template.spec.containers[*].env[?(@.name == "ALLOW_EMPTY_PASSWORD")].value
        action: replace
        value: !!str "false"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "redis-master")]

      - name: "ensure the redis tls flag stays a string"
        query: spec.template.spec.containers[*].env[?(@.name == "REDIS_TLS_ENABLED")].value
        action: replace
        value: !!str "false"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "redis-master")]

      - name: "ensure other redis changes are made"
        query: spec
        action: merge
        value:
          replicas: !!int {{ .redis.replicas }}
          template:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "redis-master")]
