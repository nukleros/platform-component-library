---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
    action: delete

yamlFiles:
  - name: "infisical rbac"
    path: "../../vendor/infisical.yaml"
    outputPath: "secrets/infisical/rbac.yaml"
    overlays:
      - name: "ensure we are only acting upon rbac resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ServiceAccount")]
              - query: $[?($.kind != "Role")]
              - query: $[?($.kind != "RoleBinding")]

      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"

      - name: "prefix the component/app labels with app.kubernetes.io"
        query: metadata.labels
        action: merge
        value:
          app.kubernetes.io/component: infisical
          app.kubernetes.io/app: infisical-standalone
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name != "postgresql")]
              - query: $[?($.metadata.name != "redis-master")]

      - name: "remove the unprefixed component/app labels"
        query:
          - metadata.labels.component
          - metadata.labels.app
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name != "postgresql")]
              - query: $[?($.metadata.name != "redis-master")]

      - name: "shorten the redundant infisical-infisical service account name"
        query: metadata.name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "ServiceAccount")]
              - query: $[?($.metadata.name == "infisical-infisical")]

      - name: "shorten the redundant infisical-infisical role name"
        query: metadata.name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "Role")]
              - query: $[?($.metadata.name == "infisical-infisical")]

      - name: "shorten the redundant infisical-infisical-bootstrap role name"
        query: metadata.name
        action: replace
        value: "infisical-bootstrap"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "Role")]
              - query: $[?($.metadata.name == "infisical-infisical-bootstrap")]

      - name: "update the primary role binding's service account reference"
        query: subjects[*].name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical")]

      - name: "shorten the primary role binding's name"
        query: metadata.name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical")]

      - name: "update the primary role binding's role reference to match the renamed role"
        query: roleRef.name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical")]

      - name: "update the bootstrap role binding's service account reference"
        query: subjects[*].name
        action: replace
        value: "infisical"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical-bootstrap")]

      - name: "shorten the bootstrap role binding's name"
        query: metadata.name
        action: replace
        value: "infisical-bootstrap"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical-bootstrap")]

      - name: "update the bootstrap role binding's role reference to match the renamed role"
        query: roleRef.name
        action: replace
        value: "infisical-bootstrap"
        documentQuery:
          - conditions:
              - query: $[?($.kind == "RoleBinding")]
              - query: $[?($.roleRef.name == "infisical-infisical-bootstrap")]
