#
# NOTE: this is the helm values file for the Infisical helm chart, which is 
# vendored in via the vendor.yaml file.
#
infisical:
  fullnameOverride: "infisical"
  image:
    repository: infisical/infisical
    tag: "v0.162.19"
    pullPolicy: IfNotPresent
  replicaCount: 2
  autoBootstrap:
    enabled: true
    organization: "Default"
    secretDestination:
      name: "infisical-bootstrap-secret"
      namespace: "infisical"
    credentialSecret:
      name: "infisical-bootstrap-credentials"
  extraEnv:
    - name: MAX_MACHINE_IDENTITY_TOKEN_AGE
      value: "30d"
ingress:
  enabled: true
  hostName: "secrets.example.com"
  nginx:
    enabled: false

