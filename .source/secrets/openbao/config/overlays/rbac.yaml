---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      platform.nukleros.io/category: "{{ .category }}"
      platform.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "remove the helm info"
    query:
      - metadata.labels["helm.sh/chart"]
      - metadata.labels["app.kubernetes.io/managed-by"]
      - metadata.labels["heritage"]
      - metadata.labels["release"]
      - metadata.labels["chart"]
    action: delete

yamlFiles:
  - name: "openbao rbac"
    path: "../../vendor/openbao.yaml"
    outputPath: "secrets/openbao/rbac.yaml"
    overlays:
      - name: "ensure we are only acting upon rbac resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ServiceAccount")]
              - query: $[?($.kind != "Role")]
              - query: $[?($.kind != "RoleBinding")]
              - query: $[?($.kind != "ClusterRole")]
              - query: $[?($.kind != "ClusterRoleBinding")]

      - name: "ensure namespace is updated (no-op on the cluster-scoped ClusterRole/ClusterRoleBinding, which correctly have none)"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"

  # our own hand-authored RBAC (not sourced from the upstream chart) - kept as
  # a static file rather than templated through values-helm.yaml, since it's
  # not upstream chart content. All RBAC still lands in this one output file.
  - name: "openbao static rbac"
    path: "../../static/rbac.yaml"
    outputPath: "secrets/openbao/rbac.yaml"
    overlays:
      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"
