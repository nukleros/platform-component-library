global:
  enabled: true
  namespace: "nukleros-secrets-system"

  # NOTE: we set tls to disabled for ease of testing (no external dependency on cert-manager).  a
  #       real production install would have this set to enabled and use cert-manager.
  tlsDisable: true

injector:
  enabled: "true"
  replicas: 2
  port: 8080
  leaderElector:
    enabled: true
  metrics:
    enabled: true

  # soften the chart's default hard anti-affinity so this can still schedule on a
  # single-node cluster; multi-node clusters still get spread across nodes when possible.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: openbao-agent-injector
                app.kubernetes.io/instance: openbao
                component: webhook
            topologyKey: kubernetes.io/hostname

  nodeSelector:
    kubernetes.io/os: linux
  agentDefaults:
    cpuLimit: null
    cpuRequest: "250m"
    memLimit: "128Mi"
    memRequest: "64Mi"
  logFormat: "json"
  revokeOnShutdown: false

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 256Mi

server:
  logFormat: "json"
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 256Mi

  # NOTE: we set ingress to false for PCL to make the kubectl apply for testing easier.
  ingress:
    enabled: false

  # soften the chart's default hard anti-affinity so this can still schedule on a
  # single-node cluster; multi-node clusters still get spread across nodes when possible.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
                app.kubernetes.io/instance: openbao
                component: server
            topologyKey: kubernetes.io/hostname

  nodeSelector:
    kubernetes.io/os: linux

  networkPolicy:
    enabled: true
    # unbounded egress - no port/destination restriction
    egress:
      - {}
    ingress:
      - ports:
          - port: 8200
            protocol: TCP
          - port: 8201
            protocol: TCP

  # Mounts the openbao-unseal-key Secret (created out-of-band, not via this
  # chart/values file) at /openbao/userconfig/openbao-unseal-key/ so the
  # seal "static" stanza in server.ha.raft.config can auto-unseal from the key file.
  extraVolumes:
    - type: secret
      name: openbao-unseal-key
      defaultMode: 0400

  auditStorage:
    enabled: true
    size: 10Gi

  ha:
    enabled: true
    replicas: 3
    apiAddr: null
    clusterAddr: null
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          #telemetry {
          #  unauthenticated_metrics_access = "true"
          #}
        }

        storage "raft" {
          path = "/openbao/data"

          # each peer tries the others in turn so the 3 replicas form a single
          # raft cluster automatically, without a manual "operator raft join" per pod
          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

        # Auto-unseal via a locally-mounted static key (no cloud provider, no HSM,
        # no second Vault/OpenBao instance) - suited to a local, airgapped install.
        # The key file comes from the openbao-unseal-key Secret mounted via
        # server.extraVolumes above. Generate and load the key out-of-band, e.g.:
        #   kubectl create secret generic openbao-unseal-key \
        #     --namespace nukleros-secrets-system \
        #     --from-literal=unseal-key.key=$(openssl rand -base64 32)
        # (base64, not raw bytes: OpenBao's static seal accepts base64/hex key
        # material, and raw random bytes can contain a NUL byte that a shell
        # command substitution silently strips, corrupting the key)
        seal "static" {
          current_key_id = "initial"
          current_key    = "file:///openbao/userconfig/openbao-unseal-key/unseal-key.key"
        }

    disruptionBudget:
      enabled: true

  # Idempotently initializes the raft cluster once, from the first replica only
  # (pods 1/2 come up after pod 0 is already Ready/initialized, and join it
  # automatically via retry_join above - they don't need to do this at all).
  #
  # This runs its OWN short-lived "bao server" against the same config/data
  # volume, rather than calling the pod's real "openbao" container - that
  # container doesn't exist yet while initContainers run, so there'd be nothing
  # to call. Bootstrapping storage here means the real "openbao" container
  # always starts already-initialized, instead of racing its own startup
  # against a postStart hook trying to unseal it (which also has no way to
  # surface `bao operator init`'s output via `kubectl logs`).
  #
  # bao CLI has no built-in "skip if already initialized" flag (confirmed
  # against the docs), so idempotency is handled here by checking `bao status`.
  extraInitContainers:
    - name: bao-init
      image: quay.io/openbao/openbao:2.6.2
      securityContext:
        allowPrivilegeEscalation: false
      # This runs the same HCL config the real "openbao" container does, so it
      # needs the same environment that config depends on (cluster/API address,
      # kubernetes service_registration namespace/pod name, etc.) - mirrors the
      # main container's env below rather than guessing which vars matter.
      env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: BAO_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: BAO_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: BAO_ADDR
          value: "http://127.0.0.1:8200"
        - name: BAO_API_ADDR
          value: "http://$(POD_IP):8200"
        - name: BAO_CLUSTER_ADDR
          value: "https://$(HOSTNAME).openbao-internal:8201"
        - name: HOME
          value: "/home/openbao"
        - name: BAO_LOG_FORMAT
          value: "json"
      volumeMounts:
        - name: config
          mountPath: /openbao/config
        - name: data
          mountPath: /openbao/data
        - name: userconfig-openbao-unseal-key
          readOnly: true
          mountPath: /openbao/userconfig/openbao-unseal-key
        - name: home
          mountPath: /home/openbao
      command:
        - /bin/sh
        - -c
        - |
          [ "$(hostname)" = "openbao-0" ] || exit 0

          cp /openbao/config/extraconfig-from-values.hcl /tmp/storageconfig.hcl
          bao server -config=/tmp/storageconfig.hcl &
          BAO_PID=$!

          n=0
          while ! bao status 2>/dev/null | grep -q '^Initialized'; do
            n=$((n+1))
            if [ "$n" -ge 30 ]; then
              kill -TERM "$BAO_PID"
              wait "$BAO_PID" 2>/dev/null
              exit 0
            fi
            sleep 2
          done

          if ! bao status 2>/dev/null | grep -Eq '^Initialized +true'; then
            INIT_OUTPUT="$(bao operator init -format=json 2>&1)"

            # The root token + recovery keys above are only ever printed this
            # once. Persist them to a Secret so a later pod restart (which
            # skips straight past this block, since it's already initialized)
            # doesn't leave them unrecoverable in a log that's since rotated
            # away. Only ever creates this one, specific secret name - see the
            # RBAC note on the Role granting this.
            #
            # --no-check-certificate: this image's wget has no way to point at
            # a custom CA bundle (no --ca-certificate flag, and neither
            # SSL_CERT_FILE nor appending to the system bundle made it trust a
            # test cert when checked) so it can't validate the cluster's own
            # API server certificate. This call stays inside the pod network
            # and is bearer-token authenticated regardless, so skipping server
            # cert validation is an accepted tradeoff for this one-time
            # bootstrap call rather than a real MITM exposure.
            TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
            if [ -f "$TOKEN_FILE" ]; then
              RECOVERY_KEYS=$(printf '%s' "$INIT_OUTPUT" | sed -n '/"recovery_keys_b64"/,/\]/p' | grep -oE '"[A-Za-z0-9+/=]{20,}"' | tr -d '"')
              B64_INIT=$(printf '%s' "$INIT_OUTPUT" | base64 | tr -d '\n')
              B64_RECOVERY=$(printf '%s' "$RECOVERY_KEYS" | base64 | tr -d '\n')
              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openbao-token"},"type":"Opaque","data":{"init-output.json":"%s","recovery-keys.txt":"%s"}}' "$B64_INIT" "$B64_RECOVERY" > /tmp/secret.json
              echo "=== creating openbao-token secret ==="
              wget -q -O /dev/null --no-check-certificate \
                --header="Authorization: Bearer $(cat "$TOKEN_FILE")" \
                --header="Content-Type: application/json" \
                --post-file=/tmp/secret.json \
                "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/namespaces/${BAO_K8S_NAMESPACE}/secrets" 2>&1
              echo ""
              echo "=== secret creation attempt complete (see result above) ==="
            fi
            sleep 2
          fi

          kill -TERM "$BAO_PID"
          wait "$BAO_PID" 2>/dev/null
          exit 0

  serviceAccount:
    create: true

ui:
  enabled: true

csi:
  enabled: false

snapshotAgent:
  enabled: false
