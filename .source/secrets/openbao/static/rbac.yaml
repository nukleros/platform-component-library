---
# Grants only the ability to CREATE one specific Secret (openbao-token),
# for the bao-init init container to persist the one-time root token /
# recovery keys from "bao operator init" so a later pod restart doesn't lose
# them (init only ever runs once - subsequent restarts see the cluster is
# already initialized and skip it entirely, printing nothing).
#
# NOTE: Kubernetes RBAC cannot scope the "create" verb by resourceName - the
# object doesn't exist yet at authorization time, so resourceNames only works
# for get/update/patch/delete. This Role is therefore technically able to
# create a secret under any name, not just this one. No get/list/watch/update/
# patch/delete verbs are granted at all, though, so this identity can never
# read back or modify this secret (or any other) once created - only ever
# create new ones, which is as tightly as "create" can be scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init-secret-writer
  namespace: nukleros-secrets-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init-secret-writer
  namespace: nukleros-secrets-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-init-secret-writer
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: nukleros-secrets-system
