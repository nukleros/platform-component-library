---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  labels:
    app.kubernetes.io/name: keda-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: keda-operator
    app.kubernetes.io/version: 2.21.0
    app.kubernetes.io/instance: keda
    platform.nukleros.io/category: autoscaling
    platform.nukleros.io/project: keda
  name: keda-operator
  namespace: nukleros-autoscaling-system
spec:
  ports:
    - name: metricsservice
      port: 9666
      targetPort: 9666
    - name: metrics
      port: 8080
      targetPort: 8080
  selector:
    app: keda-operator
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: keda-operator-metrics-apiserver
    app: keda-operator-metrics-apiserver
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: keda-operator
    app.kubernetes.io/version: 2.21.0
    app.kubernetes.io/instance: keda
    platform.nukleros.io/category: autoscaling
    platform.nukleros.io/project: keda
  name: keda-operator-metrics-apiserver
  namespace: nukleros-autoscaling-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 6443
      protocol: TCP
      appProtocol: https
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: keda-operator-metrics-apiserver
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  labels:
    app.kubernetes.io/name: keda-admission-webhooks
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: keda-operator
    app.kubernetes.io/version: 2.21.0
    app.kubernetes.io/instance: keda
    platform.nukleros.io/category: autoscaling
    platform.nukleros.io/project: keda
  name: keda-admission-webhooks
  namespace: nukleros-autoscaling-system
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 9443
      appProtocol: https
    - name: metrics
      port: 8080
      targetPort: 8080
  selector:
    app: keda-admission-webhooks
