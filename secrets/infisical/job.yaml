apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-bootstrap-1
  labels:
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
  namespace: nukleros-secrets-system
spec:
  backoffLimit: 3
  template:
    metadata:
      name: infisical-bootstrap
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: infisical
        helm.sh/chart: infisical-standalone-1.10.0
        platform.nukleros.io/category: secrets
        platform.nukleros.io/project: infisical
    spec:
      serviceAccountName: infisical
      securityContext:
        fsGroup: 1001
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-infisical
          image: curlimages/curl:8.14.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
          args:
            - |
              echo "Waiting for Infisical to be ready..."
              until curl -f http://infisical:8080/api/status; do
                echo "Infisical not ready yet, retrying in 10 seconds..."
                sleep 10
              done
              echo "Infisical is ready! Proceeding with bootstrap..."
      containers:
        - name: infisical-bootstrap
          image: infisical/cli:0.41.86
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          args:
            - bootstrap
            - --domain=http://infisical:8080
            - --output=k8-secret
            - --k8-secret-name=infisical-bootstrap-secret
            - --k8-secret-namespace=infisical
            - --organization=Default
            - --k8-secret-template={"data":{"token":"{{.Identity.Credentials.Token}}"}}
            - --ignore-if-bootstrapped=true
          envFrom:
            - secretRef:
                name: infisical-bootstrap-credentials
      nodeSelector:
        kubernetes.io/os: linux
