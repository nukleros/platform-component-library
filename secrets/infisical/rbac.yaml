    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
    app.kubernetes.io/component: infisical
    app.kubernetes.io/app: infisical-standalone
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical
  namespace: nukleros-secrets-system
