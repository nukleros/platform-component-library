apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: nukleros-secrets-system
  labels:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 7.2.4
    app.kubernetes.io/component: master
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  sessionAffinity: None
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      nodePort: null
  selector:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
---
apiVersion: v1
kind: Service
metadata:
  name: infisical
  labels:
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
    app.kubernetes.io/component: infisical
    app.kubernetes.io/app: infisical-standalone
  namespace: nukleros-secrets-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: infisical
    app.kubernetes.io/app: infisical-standalone
    app.kubernetes.io/release: infisical
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
