apiVersion: v1
kind: Service
metadata:
  name: postgresql-hl
  namespace: nukleros-secrets-system
  labels:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 16.2.0
    app.kubernetes.io/component: primary
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: primary
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: nukleros-secrets-system
  labels:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 16.2.0
    app.kubernetes.io/component: primary
    platform.nukleros.io/category: secrets
    platform.nukleros.io/project: infisical
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
      nodePort: null
  selector:
    app.kubernetes.io/instance: infisical
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: primary
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: nukleros-secrets-system
